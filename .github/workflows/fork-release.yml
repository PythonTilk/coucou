name: Fork release

# Builds this fork's own Windows app each time its branch changes and publishes
# it as a release the app can update itself from (windows/src-tauri/src/updates.rs).
# Local to this fork: the job does nothing anywhere else, upstream included.
#
# Needs one repository secret, TAURI_SIGNING_PRIVATE_KEY: the private half of
# the key whose public half is in windows/src-tauri/tauri.conf.json. Without it
# the build stops, and nothing is published.

on:
  push:
    branches: [claude-code-backend-and-session-focus]
    paths:
      - 'windows/**'
      - '.github/workflows/fork-release.yml'
  workflow_dispatch:

permissions:
  contents: write

# A newer push makes an older build pointless.
concurrency:
  group: fork-release
  cancel-in-progress: true

jobs:
  release:
    if: github.repository == 'PythonTilk/coucou'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      # The whole history, for the notes: what changed since the last release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: fork-release-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: fork-release-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Island tests
        run: npm test

      # Upstream's version with this run's number on top (scripts/fork-version.mjs).
      - name: Set the version
        id: version
        shell: pwsh
        run: |
          $version = node scripts/fork-version.mjs ${{ github.run_number }} --write
          if ($LASTEXITCODE -ne 0) { throw "could not set the version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=fork-v$version" >> $env:GITHUB_OUTPUT
          "Building $version"

      # The installer alone, signed for the updater. `npm run build` (tauri's
      # beforeBuildCommand) builds coucou-hook first, which the app bundles.
      - name: Build the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "the TAURI_SIGNING_PRIVATE_KEY secret is not set" }
          npx tauri build --config src-tauri/tauri.fork-release.conf.json
          if ($LASTEXITCODE -ne 0) { throw "the build failed" }

      - name: Write the notes
        shell: pwsh
        run: |
          $previous = git tag --list 'fork-v*' --sort=-creatordate | Select-Object -First 1
          $range = if ($previous) { "$previous..HEAD" } else { "-15" }
          $lines = git log $range --first-parent --format='- %s' | Select-Object -First 15
          if (-not $lines) { $lines = '- Rebuilt, nothing else changed.' }
          $lines | Set-Content -Encoding utf8 release-notes.md
          Get-Content release-notes.md

      - name: Write latest.json
        run: node scripts/fork-latest.mjs ${{ github.repository }} ${{ steps.version.outputs.tag }} release-notes.md

      # --latest on purpose: the app reads /releases/latest/download/latest.json,
      # and this fork publishes nothing else.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          gh release create "${{ steps.version.outputs.tag }}" `
            "release/Coucou-Windows-$v.msi" `
            "release/latest.json" `
            --target "${{ github.sha }}" `
            --title "Coucou (this fork) $v" `
            --notes-file release-notes.md `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "the release was not published" }
